{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
<h2>{{ "Edit" if session else "New" }} study session</h2>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3"><label class="form-label">Title</label>
    <input name="title" class="form-control" value="{{ session.title if session else '' }}" required></div>
  <div class="mb-3"><label class="form-label">Topic</label>
    <input name="topic" class="form-control" value="{{ session.topic if session else '' }}"></div>
  <div class="mb-3"><label class="form-label">Date and time</label>
    <input type="datetime-local" name="start_time" class="form-control"
           value="{{ session.start_time.strftime('%Y-%m-%dT%H:%M') if session else '' }}" required></div>
  <div class="mb-3"><label class="form-label">Location</label>
    <input name="location" class="form-control" value="{{ session.location if session else '' }}"></div>
  <button class="btn btn-primary">Save</button>
  <a class="btn btn-link" href="{{ url_for('dashboard.group_dashboard', group_id=group.id) }}">Cancel</a>
</form></div></div>
{% endblock %}
