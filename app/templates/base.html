<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}StudySync{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('dashboard.index') }}">StudySync</a>
    <div class="ms-auto d-flex align-items-center gap-2">
      {% if current_user.is_authenticated %}
        <span class="navbar-text text-white me-2">{{ current_user.name }}</span>
        <form method="post" action="{{ url_for('auth.logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="btn btn-sm btn-outline-light">Log out</button>
        </form>
      {% else %}
        <a class="btn btn-sm btn-outline-light" href="{{ url_for('auth.login') }}">Log in</a>
        <a class="btn btn-sm btn-light" href="{{ url_for('auth.register') }}">Register</a>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container pb-5">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
